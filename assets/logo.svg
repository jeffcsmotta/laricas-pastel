<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090D14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="yellowShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="redFlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGlow)" stroke="#F59E0B" stroke-width="6" stroke-opacity="0.8"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Dynamic Red Lightning Accents -->
  <path d="M 120 250 L 190 220 L 160 255 L 220 240 L 150 300 Z" fill="url(#redFlash)" opacity="0.95"/>
  <path d="M 380 250 L 310 220 L 340 255 L 280 240 L 350 300 Z" fill="url(#redFlash)" opacity="0.95"/>

  <!-- Center Golden Geometry (Pastel / Lightning) -->
  <polygon points="250,110 370,250 250,380 130,250" fill="url(#yellowShine)" stroke="#FFFFFF" stroke-width="3"/>
  <polygon points="250,140 335,250 250,350 165,250" fill="#CA8A04" opacity="0.4"/>

  <!-- Top Decorative Stars -->
  <g fill="#FDE047">
    <polygon points="250,75 254,85 265,85 256,92 259,102 250,96 241,102 244,92 235,85 246,85" />
    <polygon points="200,90 203,97 211,97 205,102 207,109 200,105 193,109 195,102 189,97 197,97" opacity="0.8"/>
    <polygon points="300,90 303,97 311,97 305,102 307,109 300,105 293,109 295,102 289,97 297,97" opacity="0.8"/>
  </g>

  <!-- Central Brand Plaque -->
  <rect x="70" y="215" width="360" height="70" rx="12" fill="#0B0B0C" stroke="#22C55E" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Typography: LARICA'S PASTEL -->
  <text x="250" y="262" 
        font-family="'Outfit', 'Impact', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#22C55E">
    LARICA'S PASTEL
  </text>
  <text x="250" y="262" 
        font-family="'Outfit', 'Impact', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#4ADE80" opacity="0.5">
    LARICA'S PASTEL
  </text>

  <!-- Tagline below -->
  <text x="250" y="420" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="1" 
        text-anchor="middle" 
        fill="#FDE047">
    DO TAMANHO DA SUA FOME
  </text>
</svg>
